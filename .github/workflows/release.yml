# Builds the app package and attaches it to a GitHub release.
#
# Push a tag that matches the version in src/appmeta/manifest.json, e.g.
#   git tag v1.5.0
#   git push origin v1.5.0
# The release then carries io.github.superwolfi82.wakesurf.tgz, which can be uploaded
# in the BUSY Bar web interface (Apps -> Add app) without Node.js or PowerShell.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Check tag matches app version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(node -p "require('./src/appmeta/manifest.json').version")
          pkg=$(node -p "require('./package.json').version")
          echo "tag=$tag manifest=$manifest package.json=$pkg"
          if [ "$tag" != "$manifest" ] || [ "$tag" != "$pkg" ]; then
            echo "::error::Tag v$tag does not match manifest.json ($manifest) / package.json ($pkg)"
            exit 1
          fi

      - run: npm ci --no-fund --no-audit

      - name: Build package
        run: npx busy-cli build

      - name: Create release with .tgz
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pkg=dist/io.github.superwolfi82.wakesurf.tgz
          test -f "$pkg"
          gh release create "$GITHUB_REF_NAME" "$pkg" \
            --title "Wakesurf Timer $GITHUB_REF_NAME" \
            --notes "Install: connect the BUSY Bar via USB, open http://10.0.4.20/, go to **Apps → Add app** and upload \`io.github.superwolfi82.wakesurf.tgz\`. See the README for details."
